# Central `lints` configuration (managed via `lints enable` / `lints disable` / `lints target`)
# Synced across machines via `lints sync` / `lints propose` / `lints merge`.

[lints]
# Default folder directory linted when running `lints lint` with no arguments.
# Git repos with a root `lints.toml` (or an explicit `--config <path>`) override this default.
target = "."
ignore = [".git", ".venv", "venv", "__pycache__", "node_modules", "dist", "build", ".next", "out"]
rules_dir = "rules"
checklists_dir = "checklists"

[checklists]
code-quality = true
pr-quality = true

[ts]
no-nullish-coalescing = false
no-non-null-assertion = false
no-type-assertion = true
no-explicit-any = true
ban-ts-comment = true
no-process-env = true
no-multiline-ternary = true
no-default-config-singleton = true
no-zod-shorthand-pipe = true
no-default-export = true
pure-barrel-index = true
react-boundaries = true

[py]
no-getattr = true
no-inline-imports = true
no-blind-except = true
pytest-style = true
no-silent-model-default = true
no-tuple-bag-return = true
no-multiline-ternary = true
no-raw-os-environ = true
no-chained-dict-get = true
