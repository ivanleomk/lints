# Central Ruff configuration managed by `lints`
# Automatically discovered at ~/.config/ruff/ruff.toml
#
# To override in a specific project while keeping these defaults, add a
# local `ruff.toml` with:
#   extend = "~/.config/ruff/ruff.toml"

line-length = 100
target-version = "py311"

exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "node_modules",
  "dist",
  "build",
]

[lint]
select = [
  "E4",  # pycodestyle imports
  "E7",  # pycodestyle statements
  "E9",  # syntax/runtime errors
  "F",   # Pyflakes
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # Let `ruff format` handle line lengths
]

[lint.isort]
known-first-party = []

[format]
quote-style = "double"
indent-style = "space"
