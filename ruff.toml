# Auto-generated by `lints build` from `config.toml`.

line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "venv", "node_modules", "dist", "build", "rules/**/tests/**"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "TID252", "PTH", "PLE", "PERF", "FURB", "RUF", "BLE001", "E722", "B009", "TID251", "PLC0415", "PT"]
ignore = ["E501", "B008", "RET504", "PTH123", "SIM108"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.flake8-tidy-imports.banned-api."builtins.getattr"]
msg = "Dynamic `getattr()` is banned. Fix: parse into a `pydantic.BaseModel` or type with a `Protocol` and access attributes directly. Docs: `lints explain py/no-getattr`."

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[lint.per-file-ignores]
"tests/**/*.py" = ["BLE001", "PLC0415"]
"test_*.py" = ["BLE001", "PLC0415"]

[format]
quote-style = "double"
indent-style = "space"
