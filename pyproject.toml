[project]
name = "lints"
version = "0.2.0"
description = "Self-contained Ruff + Oxlint lint rules and cross-machine sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ruff>=0.15.0",
]

[project.scripts]
lints = "lints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lints"]
