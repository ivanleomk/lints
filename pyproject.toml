[project]
name = "lints"
version = "0.3.0"
description = "Self-contained Ruff + Oxlint lint rules managed via uv & Typer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "ruff>=0.15.0",
  "tomlkit>=0.13.0",
  "typer>=0.15.0",
]

[project.scripts]
lints = "lints.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lints"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.ty.src]
exclude = ["rules/**/tests/**"]
